<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Mission</title>
</head>
<body>

    <h1>🕵️ Secret Mission</h1>

    <form>
        <label>Agent Name:</label>
        <input type="text" name="agentName" required>
        <br><br>

        <label>Mission Type:</label>
        <select name="mission">
            <option>Rescue</option>
            <option>Investigation</option>
            <option>Delivery</option>
            <option>Surveillance</option>
        </select>
        <br><br>

        <label>Priority:</label>
        <input type="radio" name="priority" value="Low"> Low
        <input type="radio" name="priority" value="Medium"> Medium
        <input type="radio" name="priority" value="High"> High
        <br><br>

        <label>Location:</label>
        <input type="text" name="location">
        <br><br>

        <p>Required Equipment:</p>
        <input type="checkbox" name="equipment" value="Camera"> Camera
        <input type="checkbox" name="equipment" value="GPS"> GPS
        <input type="checkbox" name="equipment" value="Radio"> Radio
        <input type="checkbox" name="equipment" value="FirstAid"> First Aid
        <br><br>

        <label>Mission Instructions:</label>
        <br>
        <textarea rows="5" cols="40"></textarea>
        <br><br>

        <button type="submit">Accept Mission</button>
    </form>

</body>
</html>
