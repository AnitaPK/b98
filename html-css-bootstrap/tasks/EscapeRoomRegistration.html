<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Escape Room Registration</title>
</head>
<body>

    <h1>🔐 Escape Room Registration</h1>

    <form>
        <label>Team Name:</label>
        <input type="text" name="teamName" required>
        <br><br>

        <label>Number of Players:</label>
        <input type="number" name="players" min="2" max="8" required>
        <br><br>

        <label>Difficulty:</label>
        <select name="difficulty">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
        </select>
        <br><br>

        <label>Preferred Time:</label>
        <input type="time" name="time">
        <br><br>

        <label>Player Names:</label>
        <textarea name="playerNames" rows="4" cols="30"></textarea>
        <br><br>

        <input type="checkbox" required>
        <label>I agree to the game rules</label>
        <br><br>

        <button type="submit">Book Escape Room</button>
    </form>

</body>
</html>
