<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(213, 255, 241);
        }
        .container1{
            width: 600px;
            height: 400px;
            margin: 100px auto;
            position: relative;
            /* border: 1px solid red; */
        }
        .whiteBox{
            height: 400px;
            width: 400px;
            background-color: white;
            position: absolute;
            left: 100px;
        }
        .firstImg{
            position: absolute;
            top:-50px;
            right:70px
        }
        .firstImg img{
            height: 200px;
            width: 200px;
        }
        .secondImage{
            position: absolute;
            bottom: -50px;
            left: 70px;
        }
        .secondImage img{
               height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="whiteBox"></div>
        <div class="firstImg">
            <img src="./assets/restorntBGImage.jpeg" alt="">
        </div>
        <div class="secondImage">
            <img src="./assets/logo.jpeg" alt="">
        </div>
    </div>





</body>
</html>
