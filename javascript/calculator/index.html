<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="container w-50 mb-3">
        <label for="">First Numbar </label>
    <input type="number" id="n1">
        <label for="">Second Numbar </label>

    <input type="number" id="n2">
    </div>
    <div class="container">
        <p id="result"></p>
    </div>
    <div class="container w-50">
        <div class="row">
            <div class="col">
                <button class="btn btn-primary">Add</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" id="subtarctBtn">Subtract</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Multiply</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Divide</button>

            </div>
        </div>
    </div>
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
