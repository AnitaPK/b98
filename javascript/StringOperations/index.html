<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>String operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="display-4 text-primary text-center p-4">STRING OPERATION IN JS</h1>

    <div class="container">
        <div class="mb-4">
        <input type="text" class="form-control" 
        placeholder="Enter paragraph here" id="inputPara">
        </div>
        <div class="container rounded-5" 
        style="height:100px; background-color: rgb(216, 216, 216); padding-top: 30px;"
        id="result"
        >
        RESULT will show here...
        </div>
    </div>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary" onclick="checkVowels()">Check Vowels</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Check Consonents</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="checkPalindrome()">Check Palindrom</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Reverse the String</button>
            </div>
        </div>
         <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary">Convert To Upper Case</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Convert To Lower Case</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Convert To Title Case</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Reverse the String</button>
            </div>
            
        </div>
         <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary">Count New Lines</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Count Spaces</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Extract First Word</button>
            </div>
            <div class="col">
                <button class="btn btn-primary">Replace all spaces with hypens(-)</button>
            </div>
        </div>
    </div>


    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
