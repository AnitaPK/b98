<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="refresh" content="30">

    <title>Bootstrap demo</title>
    <style>
        .customSpinner{
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dataDemo{
            display: none;
            height: 700px;
            background-color: red;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="customSpinner">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="dataDemo">
            <h1 >
            <span id="hr">HR</span>:
            <span id="min">Min</span>:
            <span id="sec">Sec</span>
            </h1>
    </div>
    <script>
        setTimeout(()=>{
            document.querySelector(".customSpinner").style.display = 'none'
            document.querySelector(".dataDemo").style.display = 'block'
            setInterval(fetchTime, 1000)
        },5000)
        function fetchTime(){
            today = new Date()
            
            hr = today.getHours()
            document.querySelector("#hr").textContent = hr
             min = today.getMinutes()
            document.querySelector("#min").textContent = min
            sec = today.getSeconds()
            document.querySelector("#sec").textContent = sec
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
